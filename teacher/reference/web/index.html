<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mini Shop</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --card: #fff;
        --ink: #1c2b3a;
        --muted: #6b7c8d;
        --line: #dde3ea;
        --blue: #1a5fa8;
        --ok: #1a7a4a;
        --bad: #8b1a1a;
        --badbg: #fdecea;
        --okbg: #eaf7ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
      }
      header {
        background: var(--blue);
        color: #fff;
        padding: 14px 20px;
      }
      header h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      header p {
        margin: 2px 0 0;
        color: #cfe0f2;
        font-size: 0.9rem;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        min-width: 0;
      }
      h2 {
        margin: 0;
        font-size: 1.05rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--blue);
      }
      .src {
        font:
          0.75rem ui-monospace,
          Menlo,
          Consolas,
          monospace;
        color: var(--muted);
        margin: 2px 0 10px;
        overflow-wrap: anywhere;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 7px 0;
        border-top: 1px solid var(--line);
      }
      .row:first-of-type {
        border-top: none;
      }
      button {
        font: inherit;
        padding: 5px 12px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--blue);
      }
      button.primary {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }
      .err {
        background: var(--badbg);
        color: var(--bad);
        padding: 8px 10px;
        border-radius: 6px;
      }
      .okmsg {
        background: var(--okbg);
        color: var(--ok);
        padding: 8px 10px;
        border-radius: 6px;
      }
      .muted {
        color: var(--muted);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mini Shop</h1>
      <p>
        Three panels, three services. Each panel talks to its own service and
        fails on its own.
      </p>
    </header>
    <main>
      <section class="card">
        <h2>Products</h2>
        <div class="src" id="src-product"></div>
        <div id="products"></div>
      </section>
      <section class="card">
        <h2>Cart</h2>
        <div class="src" id="src-cart"></div>
        <div id="cart"></div>
      </section>
      <section class="card">
        <h2>Payment</h2>
        <div class="src" id="src-payment"></div>
        <div id="payment"></div>
      </section>
    </main>
    <script src="config.js"></script>
    <script>
      const S = CONFIG.services,
        $ = (id) => document.getElementById(id);
      let PRODUCTS = [],
        CART = [],
        gen = { products: 0, cart: 0, payment: 0 };
      for (const k of ["product", "cart", "payment"])
        $("src-" + k).textContent = S[k] + "  (last answer: –)";
      const setMs = (k, ms) =>
        ($("src-" + k).textContent =
          S[k] + "  (last answer: " + Math.round(ms) + " ms)");

      async function call(service, path, method, body) {
        const ctl = new AbortController(),
          t = setTimeout(() => ctl.abort(), 2500),
          t0 = performance.now();
        try {
          const r = await fetch(S[service] + path, {
            method: method || "GET",
            signal: ctl.signal,
            headers: body ? { "Content-Type": "application/json" } : {},
            body: body ? JSON.stringify(body) : undefined,
          });
          const data = await r.json().catch(() => null);
          setMs(service, performance.now() - t0);
          return { status: r.status, data };
        } catch (e) {
          throw new Error(
            e.name === "AbortError"
              ? "no answer after 2.5 s (timeout)"
              : "cannot reach " + S[service],
          );
        } finally {
          clearTimeout(t);
        }
      }
      const eur = (n) => "€" + n.toFixed(2);

      async function loadProducts() {
        const my = ++gen.products;
        try {
          const { data } = await call("product", "/products");
          if (my !== gen.products) return;
          PRODUCTS = data.products;
          $("products").innerHTML = PRODUCTS.map(
            (p) =>
              '<div class="row"><span>' +
              p.name +
              ' <span class="muted num">' +
              eur(p.price) +
              '</span></span><button data-add="' +
              p.id +
              '">Add</button></div>',
          ).join("");
        } catch (e) {
          if (my === gen.products)
            $("products").innerHTML =
              '<div class="err">Product service unavailable: ' +
              e.message +
              "</div>";
        }
      }

      async function loadCart() {
        const my = ++gen.cart;
        try {
          const { data } = await call("cart", "/cart");
          if (my !== gen.cart) return;
          CART = data.items;
          renderCart();
          renderPayment();
        } catch (e) {
          if (my === gen.cart) {
            $("cart").innerHTML =
              '<div class="err">Cart service unavailable: ' +
              e.message +
              "</div>";
            CART = [];
            renderPayment();
          }
        }
      }

      function total() {
        return CART.reduce((s, i) => {
          const p = PRODUCTS.find((p) => p.id === i.productId);
          return s + (p ? p.price * i.qty : 0);
        }, 0);
      }

      function renderCart() {
        $("cart").innerHTML = CART.length
          ? CART.map((i) => {
              const p = PRODUCTS.find((p) => p.id === i.productId);
              return (
                '<div class="row"><span>' +
                (p ? p.name : i.productId) +
                " × " +
                i.qty +
                '</span><span class="num">' +
                (p ? eur(p.price * i.qty) : "?") +
                "</span></div>"
              );
            }).join("") +
            '<div class="row"><b>Total</b><b class="num">' +
            eur(total()) +
            "</b></div>"
          : '<span class="muted">The cart is empty.</span>';
      }

      let payMsg = ""; // the last payment message stays visible until you do something else

      function renderPayment(msg) {
        if (msg !== undefined) payMsg = msg;
        const t = total();
        $("payment").innerHTML =
          payMsg +
          '<p><button class="primary" id="pay" ' +
          (t > 0 ? "" : "disabled") +
          ">Pay " +
          eur(t) +
          "</button></p>";
      }

      async function pay() {
        const my = ++gen.payment;
        try {
          const { status, data } = await call("payment", "/pay", "POST", {
            amount: Math.round(total() * 100) / 100,
            card: "4242424242424242",
          });
          if (my !== gen.payment) return;
          if (status === 200 && data && data.status === "approved") {
            await call("cart", "/cart", "DELETE").catch(() => {});
            await loadCart();
            renderPayment(
              '<div class="okmsg">Payment approved: ' + data.id + "</div>",
            );
          } else
            renderPayment(
              '<div class="err">Payment declined: ' +
                ((data && data.error) || status) +
                "</div>",
            );
        } catch (e) {
          if (my === gen.payment)
            renderPayment(
              '<div class="err">Payment service unavailable: ' +
                e.message +
                "</div>",
            );
        }
      }

      document.addEventListener("click", async (e) => {
        const add = e.target.closest("[data-add]");
        if (add) {
          payMsg = "";
          try {
            await call("cart", "/cart", "POST", {
              productId: add.dataset.add,
              qty: 1,
            });
          } catch (err) {
            $("cart").innerHTML =
              '<div class="err">Cart service unavailable: ' +
              err.message +
              "</div>";
            return;
          }
          loadCart();
        }
        if (e.target.id === "pay") pay();
      });

      loadProducts().then(loadCart);

      setInterval(() => {
        loadProducts();
        loadCart();
      }, 5000); // refresh every 5 s so you see failures appear
    </script>
  </body>
</html>
